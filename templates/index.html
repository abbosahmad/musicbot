<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiqa Bot Boshqaruv Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --input-bg: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --success-bg: #d1fae5;
            --success-text: #065f46;
        }

        body.dark-mode {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --bg-gradient: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            --card-bg: rgba(31, 41, 55, 0.95);
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #374151;
            --input-bg: #111827;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --success-bg: #064e3b;
            --success-text: #d1fae5;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid var(--border);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.05); }

        /* Sections */
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin: 20px 0 10px 0;
            font-weight: 600;
        }

        /* Form Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
            display: block;
        }

        /* Checkbox Style */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 15px;
            border-radius: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
        }

        .checkbox-wrapper input {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--primary);
        }

        .checkbox-wrapper span {
            font-weight: 600;
            font-size: 15px;
        }

        /* Night Inputs Area */
        #night_inputs {
            margin-top: 15px;
            padding: 20px;
            background-color: var(--input-bg);
            border-radius: 12px;
            border: 1px dashed var(--border);
            display: none;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-submit:active { transform: translateY(0); }

        /* Alert */
        .alert {
            padding: 15px;
            background-color: var(--success-bg);
            color: var(--success-text);
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MusiqaBot Panel</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div id="successAlert" class="alert">
        ✅ Sozlamalar muvaffaqiyatli saqlandi!
    </div>

    <form action="/update" method="post">
        
        <div class="section-title">Asosiy Sozlamalar</div>
        <div class="grid-2">
            <div class="form-group">
                <label for="planning_hour">⏰ Reja Vaqti (Soat)</label>
                <input type="number" id="planning_hour" name="planning_hour" min="0" max="23" value="{{ settings.planning_hour }}" required placeholder="05">
            </div>
            <div class="form-group">
                <label for="daily_post_count">🎵 Kunlik Limit</label>
                <input type="number" id="daily_post_count" name="daily_post_count" min="1" max="50" value="{{ settings.daily_post_count }}" required placeholder="5">
            </div>
        </div>

        <div class="section-title">Media & Manba</div>
        <div class="form-group">
            <label for="demo_duration">✂️ Demo Kesish (Soniyada)</label>
            <input type="number" id="demo_duration" name="demo_duration" min="10" max="60" value="{{ settings.demo_duration }}" required>
        </div>

        <div class="form-group">
            <label for="source_channels">📢 Manba Kanallar</label>
            <input type="text" id="source_channels" name="source_channels" value="{{ settings.source_channels }}" placeholder="@kanal1, @kanal2">
            <span class="hint">Bir nechta kanalni vergul bilan ajrating</span>
        </div>

        <div class="section-title">Qo'shimcha Rejimlar</div>
        <label class="checkbox-wrapper">
            <input type="checkbox" id="night_mode" name="night_mode" value="true" {% if settings.night_mode == 'true' %}checked{% endif %} onchange="toggleNightMode()">
            <span>🌙 Tungi Sukunat Rejimi</span>
        </label>

        <div id="night_inputs">
            <div class="grid-2">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Boshlanish (23)</label>
                    <input type="number" name="night_start" min="0" max="23" value="{{ settings.night_start }}" placeholder="23">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Tugash (07)</label>
                    <input type="number" name="night_end" min="0" max="23" value="{{ settings.night_end }}" placeholder="07">
                </div>
            </div>
            <span class="hint" style="margin-top: 10px;">Shu vaqt oralig'idagi postlar tongga ko'chiriladi.</span>
        </div>

        <button type="submit" class="btn-submit">Saqlash va Yangilash</button>
    </form>
</div>

<script>
    // Alert logikasi
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('saved') === 'true') {
        document.getElementById('successAlert').style.display = 'block';
        window.history.replaceState({}, document.title, "/");
        setTimeout(() => { 
            const alert = document.getElementById('successAlert');
            alert.style.opacity = '0';
            setTimeout(() => alert.style.display = 'none', 300);
        }, 3000);
    }

    // Tun rejimi logikasi
    function toggleNightMode() {
        const checkBox = document.getElementById('night_mode');
        const inputs = document.getElementById('night_inputs');
        
        if (checkBox.checked) {
            inputs.style.display = 'block';
            inputs.style.animation = 'slideDown 0.3s ease-out';
        } else {
            inputs.style.display = 'none';
        }
    }
    toggleNightMode();

    // Dark Mode Logikasi
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        
        body.classList.toggle('dark-mode');
        const isDark = body.classList.contains('dark-mode');
        
        btn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '☀️';
    }
</script>

</body>
</html>
